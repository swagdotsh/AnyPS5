name: Sync upstream daily

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'swagdotsh/AnyPS5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream into fork main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/merge-upstream" \
            -f branch=main \
            --jq '.message'
